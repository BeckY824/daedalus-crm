name: GitCode sync

# 把桌面端安装包同步一份到 GitCode 的发行版附件——国内的下载源。
#
# 为什么是 GitCode：GitHub 到国内实测约 55 KB/s，一个 130 MB 的包要四十分钟；
# GitCode（华为云 CDN）杭州机房实测约 19 MB/s，支持 Range（差量能用），不用备案、不花钱。
# 自己的杭州节点没备案，被阿里云按 SNI 断了（见官网仓库 deploy/latest-json.py）。
#
# 仓库 Beckhol/daedalus-crm 是从这里导入的镜像，源码和 tag 由 GitCode 自动同步；
# 这里只管发行版附件：每个版本在 GitCode 上一个发行版 v<版本>（那边没有「刷关注者动态」的顾虑，
# 不需要 GitHub 这边的滚动 Release），文件名和 GitHub 上一字不差——官网 feed 按文件名拼地址。
#
# 触发：Desktop apps 在 tag 上跑绿之后自动跑；也可以手动补某一版（workflow_dispatch 填版本号）。
# 上传完从 GitCode 公开地址逐个下回来核 sha256，核不上就红——官网 feed 探到长度对就会切过去，
# 所以这里必须是「对的才算传完」。
on:
  workflow_run:
    workflows: ["Desktop apps"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "要同步的版本号，如 0.46.10"
        required: true

permissions:
  contents: read

concurrency:
  group: gitcode-sync
  cancel-in-progress: false

env:
  GITCODE_REPO: Beckhol/daedalus-crm
  GITCODE_API: https://api.gitcode.com/api/v5

jobs:
  sync:
    # workflow_run 的 head_branch 在 tag 触发时就是 tag 名（v0.46.11）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 定版本
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VER="${INPUT_VERSION:-${RUN_TAG#v}}"
          VER="${VER#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号不对：$VER"; exit 1
          fi
          # 包挂在哪个 Release 上：大版本自己一个，小版本在滚动 Release（见 desktop.yml「挂到 Release」）
          if [ "${VER##*.}" = "0" ]; then SRC="v$VER"; else SRC="desktop-updates"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "版本 $VER，从 GitHub Release「$SRC」取包"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: 从 GitHub 取这一版的包，核 GitHub 给的 sha256
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
          SRC: ${{ steps.ver.outputs.src }}
        run: |
          mkdir -p assets
          # 按文件名里的「-<版本>-」认，和官网 latest-json.py 的认法一样
          gh api "repos/${{ github.repository }}/releases/tags/$SRC" \
            --jq ".assets[] | select(.name | contains(\"-$VER-\")) | [.name, (.digest // \"\"), (.size|tostring)] | @tsv" > assets.tsv
          if [ ! -s assets.tsv ]; then echo "::error::GitHub Release「$SRC」里没有 $VER 的包"; exit 1; fi
          cat assets.tsv
          while IFS=$'\t' read -r NAME DIGEST SIZE; do
            gh release download "$SRC" --repo "${{ github.repository }}" --pattern "$NAME" --dir assets --clobber
            GOT=$(sha256sum "assets/$NAME" | cut -d' ' -f1)
            if [ -n "$DIGEST" ] && [ "sha256:$GOT" != "$DIGEST" ]; then
              echo "::error::$NAME 下下来的 sha256 和 GitHub 记的对不上"; exit 1
            fi
            echo "$NAME  $GOT"
          done < assets.tsv

      - name: 等 GitCode 把 tag 同步过去
        env:
          TAG: v${{ steps.ver.outputs.ver }}
        run: |
          # GitCode 的仓库是自动同步的镜像，tag 可能晚几分钟到。发行版要挂在 tag 上，先等它
          for i in $(seq 1 30); do
            if git ls-remote --tags "https://gitcode.com/$GITCODE_REPO.git" "refs/tags/$TAG" | grep -q .; then
              echo "GitCode 上有 $TAG 了"; exit 0
            fi
            echo "还没有 $TAG，等 60 秒（第 $i 次）"; sleep 60
          done
          echo "::error::30 分钟了 GitCode 上还没有 $TAG。去 https://gitcode.com/$GITCODE_REPO 手动点一下同步，再重跑这个 job"
          exit 1

      - name: 建 GitCode 发行版、传附件
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          VER: ${{ steps.ver.outputs.ver }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then echo "::error::仓库密钥 GITCODE_TOKEN 没配"; exit 1; fi
          TAG="v$VER"
          # 令牌只放进一个 curl 配置文件，不出现在命令行上
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$GITCODE_TOKEN" > "$RUNNER_TEMP/auth.curl"
          api() { curl -sS --connect-timeout 30 --max-time 120 -K "$RUNNER_TEMP/auth.curl" "$@"; }

          # 已有就不再建（重跑、手动补传都会走到这里）
          CODE=$(api -o "$RUNNER_TEMP/rel.json" -w '%{http_code}' "$GITCODE_API/repos/$GITCODE_REPO/releases/tags/$TAG" || true)
          if [ "$CODE" = "200" ] && jq -e '.tag_name' "$RUNNER_TEMP/rel.json" >/dev/null 2>&1; then
            echo "GitCode 上已有发行版 $TAG"
          else
            awk -v v="$VER" '
              $0 ~ "^## " v "([（(]|$| )" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md | sed '/./,$!d' > notes.md
            {
              echo "Daedalus CRM 桌面端 $VER 的国内下载源。主仓库在 GitHub：https://github.com/${{ github.repository }}"
              echo ""
              echo "Mac Apple 芯片下载 arm64.dmg；Windows x64 下载 x64-setup.exe。未签名，首次打开的放行方法见官网下载页 https://ai-daedalus.com/download.html"
              echo ""
              echo "---"
              echo ""
              cat notes.md
            } > body.md
            jq -n --arg tag "$TAG" --arg name "$VER · 桌面端" --rawfile body body.md \
              '{tag_name: $tag, name: $name, body: $body}' > payload.json
            CODE=$(api -o "$RUNNER_TEMP/create.json" -w '%{http_code}' -X POST \
              -H "Content-Type: application/json; charset=utf-8" --data-binary @payload.json \
              "$GITCODE_API/repos/$GITCODE_REPO/releases")
            if [ "${CODE:0:1}" != "2" ]; then
              echo "::error::建发行版失败 HTTP $CODE"; cat "$RUNNER_TEMP/create.json"; exit 1
            fi
            echo "建好了发行版 $TAG"
            api -o "$RUNNER_TEMP/rel.json" "$GITCODE_API/repos/$GITCODE_REPO/releases/tags/$TAG" || true
          fi

          # 已经在上面的附件跳过（下一步会逐个核 sha256，传坏的会在那儿红）
          jq -r '.assets[]? | select(.type == "attach") | .name' "$RUNNER_TEMP/rel.json" 2>/dev/null > have.txt || true
          # 清单最后传：客户端先拿清单再按清单取 zip，清单先到就可能指向还没传完的 zip
          for FILE in $(ls assets | grep -v '\.manifest\.json\.gz$') $(ls assets | grep '\.manifest\.json\.gz$'); do
            if grep -qxF "$FILE" have.txt; then echo "已在：$FILE"; continue; fi
            ENC=$(printf '%s' "$FILE" | jq -sRr @uri)
            ok=""
            for try in 1 2 3; do
              INFO=$(api "$GITCODE_API/repos/$GITCODE_REPO/releases/$TAG/upload_url?file_name=$ENC" || true)
              URL=$(echo "$INFO" | jq -r '.url // empty' 2>/dev/null)
              if [ -z "$URL" ]; then echo "拿不到上传地址（第 $try 次）：$INFO"; sleep 5; continue; fi
              echo "$INFO" | jq -r '.headers | to_entries[] | "header = \"" + .key + ": " + .value + "\""' > "$RUNNER_TEMP/up.curl"
              # Expect 清掉：不等 100 Continue，直接传（2026-09-29 第一次跑：收到 100 之后 30 分钟 0 字节回应）。
              # 60 秒平均不到 1 KB/s 算卡住，立刻重试，别干等到超时。传了多少、多快都打出来，失败了看得出是哪种
              : > "$RUNNER_TEMP/up.out"
              R=$(curl -sS --connect-timeout 30 --max-time 3600 --speed-limit 1024 --speed-time 60 \
                -H "Expect:" -o "$RUNNER_TEMP/up.out" -w '%{http_code} %{size_upload} %{speed_upload} %{time_total}' \
                -X PUT -K "$RUNNER_TEMP/up.curl" --data-binary "@assets/$FILE" "$URL" || true)
              read -r CODE SENT SPEED TOOK <<< "$R"
              echo "  HTTP ${CODE:-?}，传了 ${SENT:-0} / $(stat -c %s "assets/$FILE") 字节，${SPEED:-0} B/s，用时 ${TOOK:-?} 秒"
              if [ "${CODE:0:1}" = "2" ]; then ok=1; echo "传好：$FILE"; break; fi
              echo "传失败（第 $try 次）"; head -c 500 "$RUNNER_TEMP/up.out" || true; echo; sleep 5
            done
            [ -n "$ok" ] || { echo "::error::$FILE 传了三次都没成"; exit 1; }
          done
          rm -f "$RUNNER_TEMP/auth.curl" "$RUNNER_TEMP/up.curl"

      - name: 从 GitCode 公开地址下回来，核 sha256 和 Range
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          # 客户端和官网都是匿名下：这里也匿名，走的是和用户一模一样的那条路
          BASE="https://gitcode.com/$GITCODE_REPO/releases/download/v$VER"
          bad=0
          for FILE in $(ls assets); do
            ENC=$(printf '%s' "$FILE" | jq -sRr @uri)
            WANT=$(sha256sum "assets/$FILE" | cut -d' ' -f1)
            GOT=$(curl -sSfL --retry 3 --max-time 1800 "$BASE/$ENC" | sha256sum | cut -d' ' -f1)
            # 差量靠 Range：206 才算
            RANGE=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$BASE/$ENC")
            if [ "$GOT" = "$WANT" ] && [ "$RANGE" = "206" ]; then
              echo "✓ $FILE  $GOT  Range=$RANGE"
            else
              echo "::error::$FILE 对不上：GitCode $GOT / 本地 $WANT / Range=$RANGE"; bad=1
            fi
          done
          echo "下载地址：$BASE/<文件名>"
          exit $bad
