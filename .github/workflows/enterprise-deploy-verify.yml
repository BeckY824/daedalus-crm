name: Enterprise deploy verify

# 企业版私有部署包（deploy/enterprise）在干净的 Linux 上真起一遍（2026-10-24）。
# 本机不开 Docker，compose 的验证都放这里：用这次检出的代码就地打镜像，照部署手册的样子写 .env，
#   docker compose up -d → 等 crm 容器健康 → 经 Caddy 走 HTTPS 打 /api/health → 核容器里 CRM_ENTERPRISE=1
#   → 备份脚本出一份加密备份 → 删一个标记文件 → 恢复脚本恢复 → 标记回来了、应用又健康 → down -v。
# DOMAIN=localhost 时 Caddy 用自带 CA 发证书，不去 Let's Encrypt，所以 curl 带 -k。
# 只读：不推镜像、不碰 GHCR、不碰任何服务器。正式机上的实跑等测试机。
on:
  pull_request:
    paths:
      - "deploy/enterprise/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/enterprise-deploy-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 企业版部署包 compose 起停
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: deploy/enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 就地打镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: crm-enterprise-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写 .env（和 install.sh 生成的一样，只是镜像换成刚打的）
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^CRM_VERSION=.*|CRM_VERSION=local|" \
            -e "s|^DOMAIN=.*|DOMAIN=localhost|" \
            -e "s|^INIT_PASSWORD=.*|INIT_PASSWORD=$(openssl rand -hex 16)|" \
            .env
          echo "CRM_IMAGE=crm-enterprise-ci" >> .env
          mkdir -p certs
          docker compose config --quiet

      - name: docker compose up -d
        run: docker compose up -d

      - name: 等 crm 容器健康（最多 5 分钟）
        run: |
          for i in $(seq 1 60); do
            s="$(docker inspect -f '{{.State.Health.Status}}' crm 2>/dev/null || echo 没起来)"
            echo "第 ${i} 次：${s}"
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 5
          done
          echo "::error::crm 容器没有变健康"
          exit 1

      - name: 经 Caddy 走 HTTPS 打健康检查
        run: |
          for i in $(seq 1 12); do
            curl -kfsS --resolve localhost:443:127.0.0.1 https://localhost/api/health && exit 0
            sleep 5
          done
          echo "::error::https://localhost/api/health 不通"
          exit 1

      - name: 容器里企业版开着
        run: test "$(docker compose exec -T crm printenv CRM_ENTERPRISE)" = 1

      - name: 状态脚本
        run: ./scripts/status.sh

      - name: 备份 → 删标记 → 恢复 → 标记回来
        run: |
          ./scripts/backup-password.sh
          docker compose exec -T -u 0 crm sh -c 'echo ci > /data/ci-marker'
          ./scripts/backup.sh
          ls -l backups/
          docker compose exec -T -u 0 crm rm /data/ci-marker
          CONFIRM=RESTORE ./scripts/restore.sh
          test "$(docker compose exec -T crm cat /data/ci-marker)" = ci
          # restore.sh 自己等到应用健康才退出；这里再从 Caddy 外面确认一次
          curl -kfsS --resolve localhost:443:127.0.0.1 https://localhost/api/health

      - name: 失败时的日志
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 300 || true

      - name: docker compose down -v
        if: always()
        run: docker compose down -v --remove-orphans || true
