name: Enterprise deploy verify

# 企业版私有部署包（deploy/enterprise）在干净的 Linux 上真起一遍（2026-10-24）。
# 本机不开 Docker，compose 的验证都放这里。三个裁判，红了就是没做完：
#   build          用这次检出的代码就地打镜像（版本号带 -ci 后缀），tools/pack.sh 打成和给客户一样的
#                  部署包 + 离线镜像包，传给下面两组
#   upgrade-drill  ×3：先装 GHCR 上最新发布的版本（客户现在跑的）→ tools/verify-upgrade.sh 用离线包
#                  升级 → 回滚 → 再升级，每步经 HTTPS 核版本、核数据表一张没少 → 升到一个起不来的版本号，
#                  核 upgrade.sh 自动退回
#   restore-drill  ×3：解开部署包，计时跑 install.sh（一条命令装好，超过 30 分钟算失败）。
#                  三遍访问地址各不同：localhost / 127.0.0.1 / runner 内网 IP——后两遍走「用 IP 装」，
#                  HTTPS 由 Caddy 内部 CA 自签：导出根证书后 curl 不带 -k 也要验得过 →
#                  tools/smoke.sh：管理员登录 → 加成员 → 成员登录 → 健康检查 →
#                  每日备份的 /etc/cron.d/crm-backup 已装、手动 scripts/backup.sh 能出备份文件 →
#                  tools/restore-drill.sh --fill：灌数据 → 备份 → 5 种坏备份必须被拒 → 清空 →
#                  只拿异地备份恢复 → 逐表逐文件比对指纹 → 启动、HTTPS 检查
# 升级、恢复各跑三遍，三遍都绿才算过（matrix 不 fail-fast，哪一遍红了都看得到）。
# DOMAIN=localhost 或 IP 时 Caddy 用自带 CA 发证书，不去 Let's Encrypt，所以 curl 带 -k。
# 安装输出里的初始密码、备份密码先 ::add-mask:: 再打印，日志里看不到。
# 只读：只从 GHCR 拉公开镜像，不推镜像、不碰任何服务器。正式机上的实跑在测试机（tools/UPGRADE-RUNBOOK.md）。

on:
  pull_request:
    paths:
      - "deploy/enterprise/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "prisma/**"
      - ".github/workflows/enterprise-deploy-verify.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 打镜像、打交付包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      civ: ${{ steps.ver.outputs.civ }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: lib.sh 小测试（IP 判断、地址整理、证书模式）
        run: bash deploy/enterprise/tools/drill/test-lib.sh
      - name: 定版本号
        id: ver
        run: |
          # 不带 run 号：package.json 每次都一样，依赖层的缓存才命中
          CIV="$(jq -r .version package.json)-ci"
          echo "CIV=$CIV" >> "$GITHUB_ENV"
          echo "civ=$CIV" >> "$GITHUB_OUTPUT"
      - name: 这次的代码打成 ${{ env.CIV }}
        run: npm pkg set version="$CIV"
      - name: 就地打镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/becky824/daedalus-crm:${{ env.CIV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: tools/pack.sh 打交付包（和给客户的一样：部署包 + 离线镜像包 + .sha256）
        run: LOCAL_APP_IMAGE=1 deploy/enterprise/tools/pack.sh "$CIV" "$RUNNER_TEMP/pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-pkg
          path: ${{ runner.temp }}/pkg
          retention-days: 1
          compression-level: 0

  upgrade-drill:
    name: 升级演练 第 ${{ matrix.round }} 遍
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    env:
      CIV: ${{ needs.build.outputs.civ }}
      IMAGE: ghcr.io/becky824/daedalus-crm
    defaults:
      run:
        shell: bash
        working-directory: deploy/enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: enterprise-pkg
          path: ${{ runner.temp }}/pkg
      - name: 拉 GHCR 上最新发布的版本
        run: |
          docker pull "$IMAGE:latest"
          REL="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:latest")"
          echo "最新发布：${REL}"
          [ -n "$REL" ] && [ "$REL" != "$CIV" ] || { echo "::error::读不到最新发布的版本号"; exit 1; }
          docker tag "$IMAGE:latest" "$IMAGE:$REL"
          echo "REL=$REL" >> "$GITHUB_ENV"

      - name: 写 .env（和 install.sh 生成的一样），先装已发布的版本
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^CRM_VERSION=.*|CRM_VERSION=$REL|" \
            -e "s|^DOMAIN=.*|DOMAIN=localhost|" \
            -e "s|^INIT_PASSWORD=.*|INIT_PASSWORD=$(openssl rand -hex 16)|" \
            .env
          mkdir -p certs
          docker compose config --quiet
          ./scripts/backup-password.sh >/dev/null

      - name: docker compose up -d（已发布的版本）
        run: docker compose up -d

      - name: 等 crm 容器健康（最多 5 分钟）
        run: |
          for i in $(seq 1 60); do
            s="$(docker inspect -f '{{.State.Health.Status}}' crm 2>/dev/null || echo 没起来)"
            echo "第 ${i} 次：${s}"
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 5
          done
          echo "::error::crm 容器没有变健康"
          exit 1

      - name: 升级 → 回滚 → 再升级（tools/verify-upgrade.sh，和测试机上跑的同一个）
        run: CRM_DIR="$PWD" FILL=1 ./tools/verify-upgrade.sh --load "$RUNNER_TEMP/pkg/crm-images-$CIV.tar.gz"

      - name: 新版本起不来时 upgrade.sh 自动退回
        run: |
          # 同一个镜像换个版本号：健康检查报的还是 $CIV，对不上，upgrade.sh 应当判失败并退回
          docker tag "$IMAGE:$CIV" "$IMAGE:0.0.0-bad"
          if SKIP_BACKUP=1 UPGRADE_TIMEOUT=30 ./scripts/upgrade.sh 0.0.0-bad; then
            echo "::error::升到起不来的版本，upgrade.sh 却报成功"; exit 1
          fi
          grep -qx "CRM_VERSION=$CIV" .env || { echo "::error::.env 没退回 $CIV"; grep CRM_VERSION .env; exit 1; }
          test "$(cat .previous-version)" = "$REL" || { echo "::error::.previous-version 应当还是 $REL"; exit 1; }
          curl -kfsS --resolve localhost:443:127.0.0.1 https://localhost/api/health | grep -q "\"version\":\"$CIV\""

      - name: 容器里企业版开着
        run: test "$(docker compose exec -T crm printenv CRM_ENTERPRISE)" = 1

      - name: 状态脚本
        run: ./scripts/status.sh

      - name: 失败时的日志
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 300 || true

      - name: docker compose down -v
        if: always()
        run: docker compose down -v --remove-orphans || true

  restore-drill:
    name: 安装 + 恢复演练 第 ${{ matrix.round }} 遍（${{ matrix.addr }}）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - round: 1
            addr: localhost
          - round: 2
            addr: 127.0.0.1
          - round: 3
            addr: 内网IP
    env:
      CIV: ${{ needs.build.outputs.civ }}
      CRM_DIR: /opt/crm-enterprise
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: enterprise-pkg
          path: ${{ runner.temp }}/pkg
      - name: 解开部署包（客户拿到的就是这两个文件）
        run: |
          ls -lh "$RUNNER_TEMP/pkg"
          sudo tar -xzf "$RUNNER_TEMP/pkg/crm-enterprise-$CIV.tar.gz" -C /opt
          test -x "$CRM_DIR/scripts/install.sh"
          test -x "$CRM_DIR/tools/smoke.sh"

      - name: 定访问地址
        run: |
          ADDR="${{ matrix.addr }}"
          if [ "$ADDR" = 内网IP ]; then ADDR="$(hostname -I | awk '{print $1}')"; fi
          echo "访问地址：$ADDR"
          [ -n "$ADDR" ] || { echo "::error::取不到 runner 内网 IP"; exit 1; }
          echo "ADDR=$ADDR" >> "$GITHUB_ENV"
          # localhost 走 --resolve 打本机；IP 直接连这个 IP（内网 IP 那遍走的是真网卡，不是回环）
          if [ "$ADDR" = localhost ]; then echo "RESOLVE=--resolve localhost:443:127.0.0.1" >> "$GITHUB_ENV"; else echo "RESOLVE=" >> "$GITHUB_ENV"; fi

      - name: 一条命令装好（计时，超过 30 分钟算失败）
        working-directory: /opt/crm-enterprise
        run: |
          OUT="$RUNNER_TEMP/install.out"
          T0=$(date +%s)
          # 输出先进文件、打码后再打印：里面有初始密码和备份密码
          set +e
          sudo ./scripts/install.sh --domain "$ADDR" --load "$RUNNER_TEMP/pkg/crm-images-$CIV.tar.gz" < /dev/null > "$OUT" 2>&1
          RC=$?
          set -e
          S=$(( $(date +%s) - T0 ))
          chmod 600 "$OUT"
          PW="$(sed -n 's/^  初始密码：  *//p' "$OUT" | head -1)"
          [ -z "$PW" ] || echo "::add-mask::$PW"
          BP="$(sudo cat "$CRM_DIR/secrets/backup.pass" 2>/dev/null || true)"
          [ -z "$BP" ] || echo "::add-mask::$BP"
          cat "$OUT"
          [ "$RC" = 0 ] || { echo "::error::install.sh 退出码 $RC"; exit 1; }
          [ -n "$PW" ] || { echo "::error::安装输出里没有初始密码"; exit 1; }
          # 只给后面的 smoke 用；install.sh 已把 .env 里的明文清掉
          umask 077; printf '%s\n' "$PW" > "$RUNNER_TEMP/admin.pass"
          echo "安装用时 ${S} 秒"
          echo "### 安装用时 ${S} 秒（第 ${{ matrix.round }} 遍，访问地址 ${{ matrix.addr }}）" >> "$GITHUB_STEP_SUMMARY"
          [ "$S" -lt 1800 ] || { echo "::error::安装用了 ${S} 秒，超过 30 分钟"; exit 1; }
          sudo grep -qx "DOMAIN=$ADDR" .env || { echo "::error::.env 的 DOMAIN 不是 $ADDR"; exit 1; }
          sudo grep -q '^INIT_PASSWORD=$' .env || { echo "::error::.env 里还留着初始密码"; exit 1; }
          curl -kfsS $RESOLVE "https://$ADDR/api/health" | grep -q "\"version\":\"$CIV\""

      - name: 用 IP 装的 HTTPS：内部 CA 自签，导出根证书后不带 -k 也验得过
        if: matrix.addr != 'localhost'
        working-directory: /opt/crm-enterprise
        run: |
          sudo grep -qx 'tls internal' certs/tls.caddy || { echo "::error::certs/tls.caddy 应当是 tls internal"; exit 1; }
          sudo ./scripts/export-root-cert.sh "$RUNNER_TEMP/crm-root-ca.crt"
          # 不带 -k、不带 SNI（IP 访问时浏览器就不带）：证书链要验得过、证书里要有这个 IP
          curl -fsS --cacert "$RUNNER_TEMP/crm-root-ca.crt" "https://$ADDR/api/health" | grep -q "\"version\":\"$CIV\""
          echo | openssl s_client -connect "$ADDR:443" 2>/dev/null | openssl x509 -noout -ext subjectAltName | tee /dev/stderr | grep -q "IP Address:$ADDR"
          # 不信任这张根证书时必须验不过（证明真是自签、不是别的什么证书）
          if curl -fsS -o /dev/null "https://$ADDR/api/health" 2>/dev/null; then echo "::error::没装根证书也验过了，不对"; exit 1; fi
          sudo ./scripts/status.sh | grep 'HTTPS 证书'

      - name: 冒烟（tools/smoke.sh：管理员登录 → 加成员 → 成员登录 → 健康检查）
        working-directory: /opt/crm-enterprise
        run: |
          sudo ./tools/smoke.sh --password-file "$RUNNER_TEMP/admin.pass" 2>&1 | tee "$RUNNER_TEMP/smoke.out"
          # 自检：密码不能出现在冒烟输出里
          if grep -qF -f "$RUNNER_TEMP/admin.pass" "$RUNNER_TEMP/smoke.out"; then echo "::error::冒烟输出里出现了密码"; exit 1; fi
          rm -f "$RUNNER_TEMP/admin.pass"

      - name: 每日备份已装、手动备份能出文件
        working-directory: /opt/crm-enterprise
        run: |
          test -f /etc/cron.d/crm-backup || { echo "::error::没有 /etc/cron.d/crm-backup"; exit 1; }
          cat /etc/cron.d/crm-backup
          grep -q "cd \"$CRM_DIR\" && ./scripts/backup.sh >> /var/log/crm-backup.log" /etc/cron.d/crm-backup || { echo "::error::定时任务内容不对"; exit 1; }
          N0="$(sudo sh -c 'ls -1 backups/crm-*.tar.gz.enc 2>/dev/null | wc -l')"
          sudo ./scripts/backup.sh
          N1="$(sudo sh -c 'ls -1 backups/crm-*.tar.gz.enc 2>/dev/null | wc -l')"
          [ "$N1" -gt "$N0" ] || { echo "::error::backup.sh 跑完没有多出备份文件（前 ${N0} 后 ${N1}）"; exit 1; }
          sudo test -s backups/LAST_OK || { echo "::error::没有 backups/LAST_OK"; exit 1; }
          sudo ls -l backups/
          # 和定时任务一样的方式跑一次，日志要写进 /var/log/crm-backup.log
          sudo bash -c "cd '$CRM_DIR' && ./scripts/backup.sh >> /var/log/crm-backup.log 2>&1"
          sudo tail -5 /var/log/crm-backup.log

      - name: 恢复演练（tools/restore-drill.sh，和测试机上跑的同一个）
        run: sudo CRM_DIR="$CRM_DIR" deploy/enterprise/tools/restore-drill.sh --fill

      - name: 演练记录
        if: always()
        run: |
          sudo cat "$CRM_DIR/restore-drill.log" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: 失败时的日志
        if: failure()
        working-directory: /opt/crm-enterprise
        run: |
          sudo docker compose ps -a || true
          sudo docker compose logs --no-color --tail 300 || true

      - name: docker compose down -v
        if: always()
        working-directory: /opt/crm-enterprise
        run: sudo docker compose down -v --remove-orphans || true
