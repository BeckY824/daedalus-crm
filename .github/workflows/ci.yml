name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 类型 / 代码检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright test
        env:
          HOME: /root
          # 用例的浏览器固定 Asia/Shanghai，服务端也要一致，否则日期文案水合失配
          TZ: Asia/Shanghai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接跑二进制而不用 gitleaks-action：后者对只有一个提交的历史会在 git log 上报
      # "stderr is not empty"（根提交没有父提交）。扫全部历史，不只是这次 push 的差量。
      - name: 安装 gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks version
      - name: 扫描全部提交
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
