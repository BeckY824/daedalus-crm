name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个 PR 又推了新提交，旧的那轮直接取消，别排队白跑（10-24 提速）。
# push 到 main 按提交分组：每个合进来的提交都跑完，不互相取消。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 类型 / 代码检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 要 tag：tests/r2-shell-upgrade 拿老版本的 tag 建老库来测升级，浅检出没有 tag 会直接报红
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 上线用到的依赖有高危及以上漏洞就红（H-068，10-04 起）。修不了上游的用 package.json 的 overrides 钉住
      # NSIS 单测读取锁定版本的真实上游模板；不运行 Electron 下载或原生构建脚本。
      - name: 安装 NSIS 模板测试依赖
        run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      # 安装桌面依赖也会启用既有解压链路测试。7zip-bin 的文件未必带执行位，先修复并验证工具可运行。
      - name: 准备解压链路测试工具
        run: node -e "const {path7za}=require('./desktop/node_modules/7zip-bin'); require('node:fs').chmodSync(path7za,0o755); require('node:child_process').execFileSync(path7za,['i'],{stdio:'ignore'})"
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - run: npx tsc --noEmit
      - run: npx eslint .
      # 浏览器按 Playwright 版本缓存：命中了下面那步只补系统依赖，不再每次下载 Chromium（10-24 提速）
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        # 有几份单测在真 Chromium 里点组件（ai-settings-ui、import-ai-columns-ui、r6-review-otp、r7-review-auth-ui），
        # 没装浏览器整份起不来（2026-10-05 main 上第一次撞到）
      - run: npx playwright install --with-deps chromium
        # 与生产（Dockerfile 的 ENV TZ=Asia/Shanghai）一致。
        # vitest.config.ts 里也钉了一道，这里再写一次是为了让人看 workflow 就知道
      - run: npx vitest run
        env:
          TZ: Asia/Shanghai

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      # 容器里没有 setup-node，npm 下载缓存自己存（10-24 提速）
      - name: 缓存 npm 下载
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # 两次 next build（默认套、排版闸门）共用 Next 的增量编译缓存；源码没变的部分直接复用（10-24 提速）
      - name: 缓存 Next 构建
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'public/**') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      # 默认网页验生产构建，避免只验证 dev server；仍使用隔离 E2E 库。
      - run: npx playwright test
        env:
          E2E_PROD: "1"
          HOME: /root
          # 用例的浏览器固定 Asia/Shanghai，服务端也要一致，否则日期文案水合失配
          TZ: Asia/Shanghai
      # 发版前排版闸门（10-19）：桌面本地模式 + 像真客户的数据，1024/1280/1366 × AI 栏常驻 / 左栏最宽量主要页面越界、被盖住。
      # 这几天的显示 bug 都是客户先发现的，以后让它在这里先红。规则见 e2e/layout-audit.ts，不许为了变绿放宽
      - run: npx playwright test -c playwright.layout.config.ts
        env:
          E2E_PROD: "1"
          HOME: /root
          TZ: Asia/Shanghai
      # 托管版有自己的库和端口，与上面那套互不干扰
      - run: npm run test:hosted
        env:
          HOME: /root
          TZ: Asia/Shanghai
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接跑二进制而不用 gitleaks-action：后者对只有一个提交的历史会在 git log 上报
      # "stderr is not empty"（根提交没有父提交）。扫全部历史，不只是这次 push 的差量。
      - name: 安装 gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks version
      - name: 扫描全部提交
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  # 企业版网页 vs Mac / Windows 桌面端截图对比（10-24）：同一台服务器、四种身份看同一批页面，逐块比像素，差过 0.1% 就红。
  # 单独一个 job 和 E2E 并行跑，不拖总耗时。有意的差别见 e2e-parity/有意的差别.json，不许为了变绿往里加没理由的条目
  parity:
    name: 网页对桌面端截图
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - run: npx playwright test -c playwright.parity.config.ts
        env:
          E2E_PROD: "1"
          HOME: /root
          TZ: Asia/Shanghai
          E2E_SHOT_DIR: test-results/parity
      - name: 写进 Summary
        if: always()
        run: cat test-results/parity/报告.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: test-results/parity/
          retention-days: 7
