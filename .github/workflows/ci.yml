name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 类型 / 代码检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 要 tag：tests/r2-shell-upgrade 拿老版本的 tag 建老库来测升级，浅检出没有 tag 会直接报红
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 上线用到的依赖有高危及以上漏洞就红（H-068，10-04 起）。修不了上游的用 package.json 的 overrides 钉住
      # NSIS 单测读取锁定版本的真实上游模板；不运行 Electron 下载或原生构建脚本。
      - name: 安装 NSIS 模板测试依赖
        run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      # 安装桌面依赖也会启用既有解压链路测试。7zip-bin 的文件未必带执行位，先修复并验证工具可运行。
      - name: 准备解压链路测试工具
        run: node -e "const {path7za}=require('./desktop/node_modules/7zip-bin'); require('node:fs').chmodSync(path7za,0o755); require('node:child_process').execFileSync(path7za,['i'],{stdio:'ignore'})"
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - run: npx tsc --noEmit
      - run: npx eslint .
        # 有几份单测在真 Chromium 里点组件（ai-settings-ui、import-ai-columns-ui、r6-review-otp、r7-review-auth-ui），
        # 没装浏览器整份起不来（2026-10-05 main 上第一次撞到）
      - run: npx playwright install --with-deps chromium
        # 与生产（Dockerfile 的 ENV TZ=Asia/Shanghai）一致。
        # vitest.config.ts 里也钉了一道，这里再写一次是为了让人看 workflow 就知道
      - run: npx vitest run
        env:
          TZ: Asia/Shanghai

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx prisma generate
        # 托管版的控制面客户端也要生成，否则 import @/generated/control 编译不过
      - run: npx prisma generate --schema=prisma/control.prisma
        env:
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - run: npx playwright test
        env:
          HOME: /root
          # 用例的浏览器固定 Asia/Shanghai，服务端也要一致，否则日期文案水合失配
          TZ: Asia/Shanghai
      # 托管版有自己的库和端口，与上面那套互不干扰
      - run: npm run test:hosted
        env:
          HOME: /root
          TZ: Asia/Shanghai
          CONTROL_DATABASE_URL: file:/tmp/control-ci.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接跑二进制而不用 gitleaks-action：后者对只有一个提交的历史会在 git log 上报
      # "stderr is not empty"（根提交没有父提交）。扫全部历史，不只是这次 push 的差量。
      - name: 安装 gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks version
      - name: 扫描全部提交
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
