name: Release image

# 打 v* tag 时构建镜像推到 GHCR，用户可以 image: ghcr.io/becky824/daedalus-crm:<版本> 免本地构建。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tag 的版本号必须和 package.json 对得上。
      # 对不上时不会有任何报错，只会出现一个 0.22.0 的 dmg 挂在 v0.22.1 的 Release 下面，
      # 而装上它的人应用内报的还是 0.22.0，于是「检查更新」永远告诉他有新版——
      # 装完还提示，无限循环。2026-09-16 真发生过一次。
      # tests/version.test.ts 只管三个文件彼此一致，管不到 tag，所以挡在这里。
      - name: 版本号要和 tag 对得上
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          DESK=$(jq -r .version desktop/package.json)
          echo "tag=$TAG  package.json=$PKG  desktop/package.json=$DESK"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$DESK" ]; then
            echo "::error::tag v$TAG 与 package.json($PKG) / desktop/package.json($DESK) 对不上。先改三处版本号并提交，再打 tag。"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          # x86 服务器 + Apple Silicon / ARM 服务器都能直接拉
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
