name: Desktop apps

# 打桌面安装包。
#
# 现在的桌面端**自带一整套服务**（见 desktop/README.md），所以打包前要先把应用本身
# 构建一遍：要装应用的依赖、生成 Prisma 客户端、跑 next build，比从前的纯外壳慢得多。
# 只在打 tag 时跑。
#
# 产物只适用于打包机器的架构：装配时会按平台裁掉其它平台的 Prisma 引擎。
# 所以 Apple 芯片的包和 Intel 的包必须各自在对应架构的 runner 上打。
# Windows 版配置留着了，但还没验证过，先不进矩阵。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 产物要挂到 Release 上：桌面端「检查更新」的兜底源查的是最新 Release（主源是官网 feed），
# 只传成 Actions 产物的话，装出去的应用永远查不到新版本
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple 芯片
            script: dist:mac
            artifact: dmg-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tag 的版本号必须和 package.json 对得上。
      # 对不上时不会有任何报错，只会出现一个 0.22.0 的 dmg 挂在 v0.22.1 的 Release 下面，
      # 而装上它的人应用内报的还是 0.22.0，于是「检查更新」永远告诉他有新版——
      # 装完还提示，无限循环。2026-09-16 真发生过一次。
      # tests/version.test.ts 只管三个文件彼此一致，管不到 tag，所以挡在这里。
      - name: 版本号要和 tag 对得上
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          DESK=$(jq -r .version desktop/package.json)
          echo "tag=$TAG  package.json=$PKG  desktop/package.json=$DESK"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$DESK" ]; then
            echo "::error::tag v$TAG 与 package.json($PKG) / desktop/package.json($DESK) 对不上。先改三处版本号并提交，再打 tag。"
            exit 1
          fi
      # 打包脚本要在应用根目录跑 prisma generate 与 next build
      - name: 安装应用依赖
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: 安装桌面端依赖
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      # 差量更新要的两个产物：ditto 打的 zip（逐条 deflate，保符号链接和权限，解开后 codesign 能过）
      # 和它的清单（每个文件的哈希、权限、在 zip 里的偏移）。客户端拿清单和已装的包比对，
      # 对 zip 发 HTTP Range 只取变了的文件。dmg 照旧：首次安装和退路都靠它。
      # 必须在 打包 之后：那时 dist/mac-arm64 里的 .app 已经被 sign.js 签过。
      - name: 差量产物（zip + 清单）
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          VER="$(node -p 'require("./package.json").version')"
          APP="dist/mac-arm64/Daedalus CRM.app"
          ditto -c -k --keepParent --norsrc "$APP" "dist/Daedalus CRM-$VER-arm64.app.zip"
          node scripts/make-manifest.mjs "dist/Daedalus CRM-$VER-arm64.app.zip" "$VER" "dist/Daedalus CRM-$VER-arm64.manifest.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-crm-${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.app.zip
            desktop/dist/*.manifest.json.gz
            desktop/dist/*.exe
          if-no-files-found: error

      # 打 tag 时顺手挂到 Release 上。Release 不存在就建一个；已存在就只补附件。
      #
      # **小版本（patch ≠ 0）不新建 Release**，包传到一个叫 `desktop-updates` 的
      # 滚动 Release 上；大版本（0.37.0）才建自己那个正式 Release。
      #
      # 为什么这么分：GitHub 每 **publish 一个 Release** 就往所有关注者的动态里推一条
      # （prerelease 也推），而往一个**已经存在**的 Release 上传资产不会。
      # 桌面端的「检查更新」读的是官网那份 feed（desktop/latest.json），和 GitHub 无关——
      # 所以小版本照样能推送给用户，只是不刷别人的 feed。滚动 Release 一辈子只 publish 一次。
      #
      # 说明取 CHANGELOG.md 里这一版那一段，不用 --generate-notes：后者产出的是
      # 「Full Changelog: v0.23.2...v0.23.3」这种一句正文都没有的东西，而这条会推到
      # 所有关注者的 feed 里。发出去的东西要么说清改了什么，要么别发。
      # CHANGELOG 里没有对应小节时才退回自动生成的。
      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PATCH="${VER##*.}"
          ROLLING="desktop-updates"
          # 取 "## <版本>" 到下一个 "## " 之间
          awk -v v="$VER" '
            $0 ~ "^## " v "([（(]|$| )" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          if [ "$PATCH" = "0" ]; then
            # 大版本：自己一个正式 Release，说明取 CHANGELOG 那一段。这一条会进关注者的动态，是有意的
            echo "大版本 $VER → 正式 Release"
            if [ -s /tmp/notes.md ]; then
              echo "用 CHANGELOG 里 $VER 那一段作发布说明："; cat /tmp/notes.md
              gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
            else
              echo "::warning::CHANGELOG.md 里没有 $VER 这一节，退回自动生成的说明"
              gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
            fi
            DEST="$TAG"   # bash 不认中文变量名，这里一律用 ASCII
          else
            # 小版本：只往滚动 Release 里丢包，不新建 Release（不刷别人的 feed）。
            # 它标成 prerelease，这样 /releases/latest 永远指向最近一个大版本
            echo "小版本 $VER → 传到 $ROLLING，不新建 Release"
            gh release view "$ROLLING" >/dev/null 2>&1 || gh release create "$ROLLING"               --title "桌面端更新包（滚动）"               --prerelease               --notes "小版本的安装包都挂在这儿——它们不单独建 Release，免得每个补丁都去刷一遍关注者的动态。每个版本对应的改动见 CHANGELOG.md；正式版本在 Releases 列表里。"
            DEST="$ROLLING"
          fi
          gh release upload "$DEST" desktop/dist/*.dmg desktop/dist/*.app.zip desktop/dist/*.manifest.json.gz --clobber
