name: Desktop apps

# 打桌面安装包。
#
# 现在的桌面端**自带一整套服务**（见 desktop/README.md），所以打包前要先把应用本身
# 构建一遍：要装应用的依赖、生成 Prisma 客户端、跑 next build，比从前的纯外壳慢得多。
# 只在打 tag 时跑。
#
# 产物只适用于打包机器的架构：装配时会按平台裁掉其它平台的 Prisma 引擎。
# 所以 Apple 芯片的包和 Intel 的包必须各自在对应架构的 runner 上打。
# Windows 版配置留着了，但还没验证过，先不进矩阵。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 产物要挂到 Release 上：桌面端的「检查更新」查的就是最新 Release，
# 只传成 Actions 产物的话，装出去的应用永远查不到新版本
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple 芯片
            script: dist:mac
            artifact: dmg-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 打包脚本要在应用根目录跑 prisma generate 与 next build
      - name: 安装应用依赖
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: 安装桌面端依赖
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-crm-${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

      # 打 tag 时顺手挂到 Release 上。Release 不存在就建一个；已存在就只补附件
      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" desktop/dist/*.dmg --clobber
