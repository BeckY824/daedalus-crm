name: Desktop apps

# 打桌面安装包。两个平台各打各的——macOS 上交叉打 Windows 包不稳。
# 只在打 tag 时跑：桌面壳改动很少，没必要每次推送都花十几分钟。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: dmg
          - os: windows-latest
            script: dist:win
            artifact: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: 打包
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-crm-${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
