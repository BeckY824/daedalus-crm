# 托管版叠加层：在基础 compose 之上打开多租户、注册、试用与运营台。
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml -f docker-compose.hosted.yml up -d
#
# 自部署的人不要用这个文件——开源版是单租户，不需要注册系统。
services:
  crm:
    environment:
      MULTI_TENANT: "1"
      CONTROL_DATABASE_URL: "file:/data/control.db"
      WORKSPACE_DIR: "/data/ws"
      # 运营台 /admin 的口令。没设置时那个页面直接 404
      ADMIN_TOKEN: "${ADMIN_TOKEN:?托管版必须设置 ADMIN_TOKEN}"
      # 共享演示工作区的 slug。没配就没有 /demo，也没有重置端点
      DEMO_WORKSPACE: "${DEMO_WORKSPACE:-}"
      # 配了就等于关闭自助注册：/signup 跳到这个地址，注册与发码动作一律拒绝。
      # 没有发码通道（短信要备案、邮件未接）时走人工开号，通道通了去掉它即可
      SIGNUP_REDIRECT: "${SIGNUP_REDIRECT:-}"
      # 验证码通道（都可选）。没配的那一种就把验证码打到容器日志里，照样能开号：
      #   docker compose logs crm | grep '\[verify\]'
      # 短信：阿里云，手机号注册用
      SMS_ACCESS_KEY_ID: "${SMS_ACCESS_KEY_ID:-}"
      SMS_ACCESS_KEY_SECRET: "${SMS_ACCESS_KEY_SECRET:-}"
      SMS_SIGN_NAME: "${SMS_SIGN_NAME:-}"
      SMS_TEMPLATE_CODE: "${SMS_TEMPLATE_CODE:-}"
      # 邮件：任何 SMTP（阿里云邮件推送 smtpdm.aliyun.com:465、腾讯云 SES、企业邮箱），邮箱注册用
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # 模型网关（桌面端本地模式用）。缺 GATEWAY_API_KEY 就等于整个网关不存在，
      # /api/gateway/** 一律 404。GATEWAY_MODELS 是白名单，第一个是默认模型——
      # 网关花的是我们的钱，不限模型的话一个改了 model 字段的请求就能挑最贵的那个
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      GATEWAY_BASE_URL: "${GATEWAY_BASE_URL:-}"
      GATEWAY_MODELS: "${GATEWAY_MODELS:-}"
      # 条款页里的运营主体与联系邮箱（可选，默认 Daedalus.AI / README 里的邮箱）
      LEGAL_ENTITY: "${LEGAL_ENTITY:-}"
      LEGAL_CONTACT: "${LEGAL_CONTACT:-}"
