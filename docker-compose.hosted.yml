# 托管版叠加层：在基础 compose 之上打开多租户、注册、试用与运营台。
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml -f docker-compose.hosted.yml up -d
#
# 自部署的人不要用这个文件——开源版是单租户，不需要注册系统。
services:
  crm:
    environment:
      MULTI_TENANT: "1"
      CONTROL_DATABASE_URL: "file:/data/control.db"
      WORKSPACE_DIR: "/data/ws"
      # 运营台 /admin 的口令。没设置时那个页面直接 404
      ADMIN_TOKEN: "${ADMIN_TOKEN:?托管版必须设置 ADMIN_TOKEN}"
      # 能从桌面端打开运营台的云端账号（邮箱或手机号，逗号分隔）。空着 = 桌面端那条路整个关着，
      # 只剩网址带口令那一条。见 src/lib/ops-auth.ts
      OPS_ACCOUNTS: "${OPS_ACCOUNTS:-}"
      # 预设测试账号：精确邮箱/手机号；与运营权限名单独立
      TEST_ACCOUNTS: "${TEST_ACCOUNTS:-}"
      # 网页版那个唯一的共享工作区的 slug（2026-09-16 起，原名 DEMO_WORKSPACE）。
      # 不配它工作区照样能用，但少了共享环境该有的两道防护：手机号不打码、
      # 设置页仍然摆着管理员那几栏——其中「测试连接」会拿平台 Key 往外发请求。
      SHARED_WORKSPACE: "${SHARED_WORKSPACE:-}"
      # 注册时要不要验证码。**默认不要**：填账号密码就能注册。
      # 配了发码通道（下面的 SMS_/SMTP_）之后设为 1，注册就多一道验证
      SIGNUP_VERIFY: "${SIGNUP_VERIFY:-}"
      # 配了就等于关闭自助注册：/signup 跳到这个地址，注册与发码动作一律拒绝。
      # 没有发码通道（短信要备案、邮件未接）时走人工开号，通道通了去掉它即可
      SIGNUP_REDIRECT: "${SIGNUP_REDIRECT:-}"
      # 官网首页那排数字（/api/public/stats）。**都可选，缺哪个就少哪个字段**，
      # 官网那边取不到就整排不渲染，不会白屏。
      #
      # UMAMI_API_KEY 一定要在这儿列出来：docker compose 读 .env 只是做变量替换，
      # 不写进 environment 就进不了容器。2026-09-19 上线时就踩了这个——
      # .env 里明明有，容器里 echo 出来是空的，接口一声不吭地少一个字段。
      # 认证三选一，按 route.ts 里的优先级：API key > 现成令牌 > 用户名密码。
      # **三种都要在这儿列出来**——2026-09-19 只补了 API_KEY 那一个，
      # 后来发现自部署的 umami 这个版本根本没有 /api/keys，只能走用户名密码，
      # 于是 .env 里配好了、容器里还是空的，接口照旧一声不吭地少一个字段。
      UMAMI_API_KEY: "${UMAMI_API_KEY:-}"
      UMAMI_TOKEN: "${UMAMI_TOKEN:-}"
      UMAMI_USERNAME: "${UMAMI_USERNAME:-}"
      UMAMI_PASSWORD: "${UMAMI_PASSWORD:-}"
      UMAMI_BASE_URL: "${UMAMI_BASE_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
      UMAMI_SINCE: "${UMAMI_SINCE:-}"
      # 验证码通道（都可选）。没配的那一种就把验证码打到容器日志里，照样能开号：
      #   docker compose logs crm | grep '\[verify\]'
      # 短信：阿里云，手机号注册用
      SMS_ACCESS_KEY_ID: "${SMS_ACCESS_KEY_ID:-}"
      SMS_ACCESS_KEY_SECRET: "${SMS_ACCESS_KEY_SECRET:-}"
      SMS_SIGN_NAME: "${SMS_SIGN_NAME:-}"
      SMS_TEMPLATE_CODE: "${SMS_TEMPLATE_CODE:-}"
      # 邮件：任何 SMTP（阿里云邮件推送 smtpdm.aliyun.com:465、腾讯云 SES、企业邮箱），邮箱注册用
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # 运营台回复反馈时，对方点「回复」到哪个邮箱。空着用代码里的公司邮箱（lib/feedback-reply.ts）
      FEEDBACK_REPLY_TO: "${FEEDBACK_REPLY_TO:-}"
      # 模型网关（桌面端本地模式用）。缺 GATEWAY_API_KEY 就等于整个网关不存在，
      # /api/gateway/** 一律 404。GATEWAY_MODELS 是白名单，第一个是默认模型——
      # 网关花的是我们的钱，不限模型的话一个改了 model 字段的请求就能挑最贵的那个
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      GATEWAY_BASE_URL: "${GATEWAY_BASE_URL:-}"
      GATEWAY_MODELS: "${GATEWAY_MODELS:-}"
      # AI 背调的搜索（lib/research/providers.ts）：用中转站自带的搜索，Key 就是上面的 GATEWAY_API_KEY。
      # RESEARCH_SEARCH 空着 = gpt（挂了自动换 claude 试一次），可填 claude / mock；RESEARCH_SEARCH_MODEL 换主用的模型
      RESEARCH_SEARCH: "${RESEARCH_SEARCH:-}"
      RESEARCH_SEARCH_MODEL: "${RESEARCH_SEARCH_MODEL:-gpt-5.5}"
      # 背调的分析模型（只给背调那一笔放行，不进平时问答的 GATEWAY_MODELS）。空着 = gpt-5.5,claude-sonnet-5.5，第一个是默认
      RESEARCH_MODELS: "${RESEARCH_MODELS:-}"
      # 背调的成本和降本开关（lib/research/price.ts）。都可以空着：
      #   RESEARCH_REPORT_MODEL 最后打分写报告（默认 gpt-5.5，用户定保证最后回复的质量）；RESEARCH_SUMMARY_MODEL 每步摘要（默认同报告）
      #   RESEARCH_SEARCH_CONTEXT GPT 搜索结果量 low/medium/high；RESEARCH_SEARCH_LIMIT 一次最多搜几次（默认 8）
      #   RESEARCH_COST_CAP 单次成本上限（元，默认 4，实验后定）；RESEARCH_PRICES 单价（默认 b.ai 10-16 实价）
      #   RESEARCH_SIGNUP_GRANT 新用户送几次背调（默认 0；背调次数和 AI 次数分开记，运营台「背调 +N」手动加）
      # 10-17 总控定默认用 C：5.5 搜（low 结果量、最多 5 次）+ mini 每步摘要 + 5.5 打分写报告（AC 同材料回放：
      #   带来源不比 A 少、核得上 / 编造不比 A 差，估成本约 4 元 / 次）。.env 里写了哪个就以 .env 为准
      RESEARCH_REPORT_MODEL: "${RESEARCH_REPORT_MODEL:-gpt-5.5}"
      RESEARCH_SUMMARY_MODEL: "${RESEARCH_SUMMARY_MODEL:-gpt-5.4-mini}"
      RESEARCH_SEARCH_CONTEXT: "${RESEARCH_SEARCH_CONTEXT:-low}"
      RESEARCH_SEARCH_LIMIT: "${RESEARCH_SEARCH_LIMIT:-5}"
      RESEARCH_COST_CAP: "${RESEARCH_COST_CAP:-}"
      RESEARCH_PRICES: "${RESEARCH_PRICES:-}"
      RESEARCH_SIGNUP_GRANT: "${RESEARCH_SIGNUP_GRANT:-}"
      # 条款页里的运营主体与联系邮箱（可选，默认 Daedalus.AI / README 里的邮箱）
      LEGAL_ENTITY: "${LEGAL_ENTITY:-}"
      LEGAL_CONTACT: "${LEGAL_CONTACT:-}"
      # 中转站余额不足的告警邮件发给谁（lib/upstream-alert.ts；要配了 SMTP 才发）。空着 = 发给 LEAD_TO / LEGAL_CONTACT
      ALERT_TO: "${ALERT_TO:-}"
