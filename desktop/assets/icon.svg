<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Daedalus CRM 应用图标。这是**源文件**，png / icns 由 scripts/make-icon.mjs 生成，别手改产物。

    形：深蓝圆角方框 + 白底 + 蓝色折线 + 右上一个节点。深蓝框就是最外沿，外面不留白。

    底板按 Apple 的图标网格：1024 画布里 824×824 居中、圆角 185。
    四周那 100px 不是白边，是留给系统投影的透明区，所有 macOS 图标都这么摆。

    颜色取自旧图标本身：深蓝 #0B1B33，蓝 #1554E8。

    ── 0.22.0 之后修掉的三处，别再加回来 ────────────────────────────
    1. 底板**不能用渐变**。原来左上 #16294D → 右下 #0A1729，看着是"有光"，
       但缩到 Dock 尺寸边框只剩 1 个实色像素，左上那头 (21,40,75) 比右下
       (10,24,42) 亮了快一倍，四个角明显不一个色，左上那块直接糊成灰白。
       要一致就只能是死色。
    2. 顶沿**不能加白色反光线**（原来是 M290 102 H734，白 .16）。它正好压在
       边框最薄的那条边上，小尺寸下和底板混成一道白，就是"左上角有白色"的来源。
    3. 边框厚度 76 太薄：32px 时不到 2.4 个像素，白底会透边。改成 96。
       内圆角必须跟着算 —— 外圆角减厚度，185 − 96 = 89，这样四周（含四个角）
       间距才处处相等。原来写 112 和 109 对不上，角上会比边上厚一点。
    ──────────────────────────────────────────────────────────
  -->
  <defs>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1554E8"/>
      <stop offset="1" stop-color="#2C6BFF"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- 投影：左右对称，只往下沉一点点。不能糊出底板侧沿，否则边缘又不一致 -->
  <rect x="132" y="156" width="760" height="760" rx="170" fill="#060D1B" opacity=".3" filter="url(#drop)"/>

  <!-- 底板：死色，四个角天然一致 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B1B33"/>

  <!-- 内部白底。厚度 96，圆角 185 − 96 = 89 -->
  <rect x="196" y="196" width="632" height="632" rx="89" fill="#FFFFFF"/>

  <!-- 折线 + 节点。含描边整体 474×456，中心正好 512/512，四周留白 79 / 88 -->
  <path d="M313 702 V526 H503 V350 H631"
        fill="none" stroke="url(#line)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="683" cy="350" r="66" fill="url(#line)"/>
</svg>
