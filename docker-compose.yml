# docker compose up -d   —— 不用改任何东西就能起。
# 登录：admin / admin123，登录后到「设置管理 → 修改密码」改掉。
# 可选项都在 .env 里（见 .env.example）；要 HTTPS 见 docs/部署.md。
services:
  crm:
    image: ghcr.io/becky824/daedalus-crm:latest
    container_name: crm
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 以下全部可选。不传 AUTH_SECRET 会自动生成并存进数据卷
      AUTH_SECRET: "${AUTH_SECRET:-}"
      # 首次启动 admin 的密码。默认 admin123 是为了上手即用，登录后请立刻改掉
      INIT_PASSWORD: "${INIT_PASSWORD:-admin123}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # 首页模型选单（可选）。逗号分隔，用 | 加备注，如 deepseek-v4.1-flash|默认
      LLM_MODELS: "${LLM_MODELS:-}"
      # 判断类模型（可选）。导入猜列用，不占 AI 次数；不填就走内置的表头对照规则
      JEV_API_KEY: "${JEV_API_KEY:-}"
      JEV_BASE_URL: "${JEV_BASE_URL:-}"
      # 静态资源（/_next/static/*）换个域名发，形如 https://cn.example.com:8443。
      # 默认空 = 不开，页面照旧从本站取。只有「服务器在境外、用户在国内」这类情况才用得上：
      # 那个域名要能把请求回源到这个应用并缓存下来。做法见 docs/托管版.md
      ASSET_PREFIX: "${ASSET_PREFIX:-}"
    volumes:
      - crm-data:/data
    # 日志封顶：默认 json-file 不限大小，跑久了会把盘吃满。三份 10 MB 滚动
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crm-data:
