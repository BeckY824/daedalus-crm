# docker compose up -d   —— 不用改任何东西就能起。
# 初始密码看日志：docker compose logs crm | grep 初始密码
# 可选项都在 .env 里（见 .env.example）；要 HTTPS 见 docs/部署.md。
services:
  crm:
    image: ghcr.io/becky824/daedalus-crm:latest
    container_name: crm
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 以下全部可选。不传 AUTH_SECRET 会自动生成并存进数据卷；不传 INIT_PASSWORD 首启会生成并打印
      AUTH_SECRET: "${AUTH_SECRET:-}"
      INIT_PASSWORD: "${INIT_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    volumes:
      - crm-data:/data

volumes:
  crm-data:
